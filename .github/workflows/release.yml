name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at $APK_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, "refs/tags/") || github.event_name == "workflow_dispatch"
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: NovaGB ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Notification to ntfy.sh
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -H "Title: NovaGB Release Status: $STATUS" \
               -d "Alur kerja release ${{ github.ref_name }} selesai dengan status $STATUS." \
               https://ntfy.sh/home_cdx_gb || true
